<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 620"
  role="img"
  aria-labelledby="agentconduit-title agentconduit-description"
>
  <title id="agentconduit-title">AgentConduit coordination overview</title>
  <desc id="agentconduit-description">
    Two independent coding agents coordinate their Git integration claims
    through a durable FIFO queue, fenced lease, and ledger before one claimant
    integrates with the shared target ref.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#0b1a2b" />
      <stop offset="1" stop-color="#10243a" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#36d7c4" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#2385c7" stop-opacity="0.08" />
      <stop offset="1" stop-color="#07111f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="agent-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58b9ff" />
      <stop offset="1" stop-color="#44d7c5" />
    </linearGradient>
    <linearGradient id="agent-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a6e" />
      <stop offset="1" stop-color="#f6b85f" />
    </linearGradient>
    <linearGradient id="authority" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44d7c5" />
      <stop offset="0.55" stop-color="#75e8db" />
      <stop offset="1" stop-color="#f6b85f" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#86a8c5" stroke-opacity="0.075" />
      <circle cx="0" cy="0" r="1.6" fill="#8fb7d4" fill-opacity="0.16" />
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000713" flood-opacity="0.5" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f6b85f" />
    </marker>
  </defs>

  <rect x="1" y="1" width="1598" height="618" rx="38" fill="url(#background)" stroke="#24405a" stroke-width="2" />
  <rect x="1" y="1" width="1598" height="618" rx="38" fill="url(#grid)" />
  <ellipse cx="810" cy="310" rx="570" ry="310" fill="url(#center-glow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="800" y="70" fill="#9fb6ca" font-size="18" font-weight="650" letter-spacing="4" text-anchor="middle">
      INDEPENDENT AGENTS · DURABLE COORDINATION · ORDERED INTEGRATION
    </text>

    <g filter="url(#shadow)">
      <rect x="82" y="145" width="320" height="128" rx="24" fill="#0e2237" stroke="#58b9ff" stroke-opacity="0.48" stroke-width="2" />
      <rect x="82" y="145" width="8" height="128" rx="4" fill="url(#agent-a)" />
      <circle cx="130" cy="189" r="12" fill="#58b9ff" fill-opacity="0.18" stroke="#58b9ff" stroke-width="2" />
      <circle cx="130" cy="189" r="4" fill="#7ed0ff" />
      <text x="160" y="196" fill="#eaf6ff" font-size="25" font-weight="750">AGENT A</text>
      <text x="130" y="238" fill="#8faabe" font-size="18" letter-spacing="0.8">worktree / feature-a</text>

      <rect x="82" y="347" width="320" height="128" rx="24" fill="#0e2237" stroke="#ff8a73" stroke-opacity="0.48" stroke-width="2" />
      <rect x="82" y="347" width="8" height="128" rx="4" fill="url(#agent-b)" />
      <circle cx="130" cy="391" r="12" fill="#ff7a6e" fill-opacity="0.18" stroke="#ff8a73" stroke-width="2" />
      <circle cx="130" cy="391" r="4" fill="#ffc08f" />
      <text x="160" y="398" fill="#eaf6ff" font-size="25" font-weight="750">AGENT B</text>
      <text x="130" y="440" fill="#8faabe" font-size="18" letter-spacing="0.8">worktree / feature-b</text>
    </g>

    <path d="M 402 209 C 515 209, 552 246, 669 278" fill="none" stroke="#183e58" stroke-width="16" stroke-linecap="round" />
    <path d="M 402 209 C 515 209, 552 246, 669 278" fill="none" stroke="url(#agent-a)" stroke-width="4" stroke-linecap="round" />
    <path d="M 402 411 C 515 411, 552 374, 669 342" fill="none" stroke="#47322f" stroke-width="16" stroke-linecap="round" />
    <path d="M 402 411 C 515 411, 552 374, 669 342" fill="none" stroke="url(#agent-b)" stroke-width="4" stroke-linecap="round" />

    <g filter="url(#glow)">
      <circle cx="486" cy="222" r="7" fill="#58b9ff" />
      <circle cx="574" cy="252" r="5" fill="#44d7c5" />
      <circle cx="486" cy="398" r="7" fill="#ff7a6e" />
      <circle cx="574" cy="368" r="5" fill="#f6b85f" />
    </g>

    <g filter="url(#shadow)">
      <circle cx="800" cy="310" r="136" fill="#0a1727" stroke="#2e596e" stroke-width="2" />
      <circle cx="800" cy="310" r="116" fill="#10273a" stroke="#44d7c5" stroke-opacity="0.42" stroke-width="2" />
      <path d="M 739 252 H 861" stroke="#35596d" stroke-width="18" stroke-linecap="round" />
      <path d="M 739 292 H 861" stroke="#35596d" stroke-width="18" stroke-linecap="round" />
      <path d="M 739 332 H 861" stroke="#35596d" stroke-width="18" stroke-linecap="round" />
      <circle cx="757" cy="252" r="8" fill="#58b9ff" />
      <circle cx="789" cy="292" r="8" fill="#ff8a73" />
      <circle cx="821" cy="332" r="8" fill="#f6b85f" />
      <path d="M 858 236 v112" stroke="#75e8db" stroke-width="5" stroke-linecap="round" />
      <path d="M 875 268 v80" stroke="#f6b85f" stroke-width="5" stroke-linecap="round" />
      <text x="800" y="390" fill="#eaf6ff" font-size="17" font-weight="750" letter-spacing="2.6" text-anchor="middle">FIFO QUEUE</text>
      <text x="800" y="416" fill="#83a5ba" font-size="15" font-weight="600" letter-spacing="1.5" text-anchor="middle">LEASE + FENCE</text>
    </g>

    <path d="M 936 310 H 1232" fill="none" stroke="#244456" stroke-width="18" stroke-linecap="round" />
    <path d="M 936 310 H 1232" fill="none" stroke="url(#authority)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
    <g filter="url(#glow)">
      <circle cx="1015" cy="310" r="6" fill="#44d7c5" />
      <circle cx="1104" cy="310" r="6" fill="#8ce8d9" />
      <circle cx="1188" cy="310" r="6" fill="#f6b85f" />
    </g>

    <g filter="url(#shadow)">
      <rect x="1250" y="246" width="266" height="128" rx="24" fill="#0e2237" stroke="#f6b85f" stroke-opacity="0.5" stroke-width="2" />
      <path d="M 1296 284 h32 m-16 -16 v32" stroke="#f6b85f" stroke-width="3" stroke-linecap="round" />
      <circle cx="1312" cy="284" r="23" fill="#f6b85f" fill-opacity="0.1" stroke="#f6b85f" stroke-opacity="0.45" />
      <text x="1354" y="291" fill="#eaf6ff" font-size="23" font-weight="750">TARGET REF</text>
      <text x="1290" y="337" fill="#9bb0c1" font-size="18">refs/heads/main</text>
    </g>

    <path d="M 800 446 V 478" stroke="#477085" stroke-width="3" stroke-dasharray="7 8" />
    <g filter="url(#shadow)">
      <ellipse cx="800" cy="500" rx="96" ry="24" fill="#15364a" stroke="#58b9ff" stroke-opacity="0.46" stroke-width="2" />
      <path d="M 704 500 v48 c0 13 43 24 96 24 s96 -11 96 -24 v-48" fill="#102a3d" stroke="#58b9ff" stroke-opacity="0.38" stroke-width="2" />
      <ellipse cx="800" cy="548" rx="96" ry="24" fill="#0d2233" stroke="#58b9ff" stroke-opacity="0.38" stroke-width="2" />
      <ellipse cx="800" cy="500" rx="72" ry="12" fill="none" stroke="#75e8db" stroke-opacity="0.32" stroke-width="2" />
      <text x="800" y="536" fill="#d7edf7" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">DURABLE LEDGER</text>
    </g>

    <text x="242" y="525" fill="#5f7e95" font-size="15" font-weight="650" letter-spacing="1.5" text-anchor="middle">SEPARATE RUNTIMES</text>
    <text x="1383" y="421" fill="#6f8ea3" font-size="15" font-weight="650" letter-spacing="1.5" text-anchor="middle">ONE AUTHORIZED CLAIMANT</text>
  </g>
</svg>
